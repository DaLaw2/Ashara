# Ashara CI — runs the same gates a developer runs locally via `just check`
# and `just test`, so there is one definition of "the gates" with two callers.

name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Require GITGUARDIAN_API_KEY
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          # Fail closed on a missing key. A secret scanner that skips because
          # it has no credential reports the same clean result as one that
          # scanned and found nothing.
          if [ -z "${GITGUARDIAN_API_KEY}" ]; then
            echo "::error::GITGUARDIAN_API_KEY is not set. The secret scan cannot run, so this job fails rather than passing unscanned."
            exit 1
          fi

      - name: GitGuardian scan
        uses: GitGuardian/ggshield-action@da20be06cafe5e8633dc24744efe1efe8d30f06b # v1.52.2
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  check:
    name: Gate
    runs-on: ubuntu-latest
    # A cap, not a budget: 20 minutes so a growing codebase hits a red gate, never this timeout.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install just
        run: |
          curl -sSf https://just.systems/install.sh | bash -s -- --tag 1.44.0 --to /usr/local/bin

      - name: Install dependencies
        run: npm ci

      - name: Gate — typecheck + boundary lint + knip + eslint
        run: just check

  test:
    name: Test suite (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # One shard runs a third of a suite that took ~8 min whole, after ~1.5 min of setup; 20 minutes
    # leaves room for the suite to grow before this cap, rather than the suite, ends the run.
    timeout-minutes: 20
    strategy:
      # Every shard reports, so one shard's failure never hides another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ashara_ci
          POSTGRES_DB: ashara_ci
          # No password, deliberately. This service lives inside the job's
          # network and is destroyed when the job ends, so a credential would
          # guard nothing. An earlier revision hardcoded one and triggered a
          # real GitGuardian incident. Do not add a password or a secret here:
          # the correct state is that there is nothing to leak.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ashara_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ashara_ci@localhost:5432/ashara_ci

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The recorded web-client session (packages/server/src/web-client.test.ts)
      # drives headless Chromium; the build is the one the pinned playwright names.
      - name: Install headless Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # packages/integration/src/execution-infra/cell.podman.test.ts runs real cells, never skipped. ubuntu-latest
      # (24.04) lists Podman 4.9.3 in its runner image; catatonit backs `podman run --init` and is
      # installed explicitly rather than assumed. Cells run with --pull=never, so the pinned BaseCell
      # image is pulled here, by the reference config/base-cell.toml names.
      - name: Prepare podman and the BaseCell image
        run: |
          sudo apt-get update
          sudo apt-get install -y podman catatonit
          podman --version
          image="$(sed -n 's/^image = "\(.*\)"$/\1/p' config/base-cell.toml)"
          test -n "$image"
          podman pull "$image"
          # The busybox cell cell.podman.test.ts runs beside the BaseCell, by the reference it names.
          alpine="$(sed -n 's/^const ALPINE_IMAGE = "\(.*\)";$/\1/p' packages/integration/src/execution-infra/cell.podman.test.ts)"
          test -n "$alpine"
          podman pull "$alpine"
          # The cell with a git client cell.podman.test.ts runs to read a cell's own repository, by the reference it names.
          gitimage="$(sed -n 's/^const GIT_IMAGE = "\(.*\)";$/\1/p' packages/integration/src/execution-infra/cell.podman.test.ts)"
          test -n "$gitimage"
          podman pull "$gitimage"

      - name: Run migrations
        run: npx tsx scripts/migrate.ts

      # vitest assigns each file to exactly one shard by a hash of its path, so the three shards
      # together run every file once.
      - name: Test suite
        run: npx vitest run --shard=${{ matrix.shard }}/3 --reporter=default --reporter=json --outputFile=vitest-results.json

      # vitest exits non-zero on a failed test, a suite that fails to collect,
      # or zero test files, but exits 0 with skipped tests; this step closes that.
      - name: Reject skipped tests
        run: |
          node -e "
            const r = require('./vitest-results.json');
            if (typeof r.numPendingTests !== 'number') throw new Error('numPendingTests is not a number: ' + JSON.stringify(r.numPendingTests));
            if (r.numPendingTests !== 0) throw new Error(r.numPendingTests + ' skipped test(s); a skipped test is a silent hole');
          "

  # The one status to require: green only when the gate and every shard report success. A
  # failed, cancelled or skipped job, or a missing result, turns it red.
  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check, test]
    if: always()

    steps:
      - name: Require success from the gate and every shard
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          status=0
          for pair in "check=${CHECK_RESULT}" "test=${TEST_RESULT}"; do
            if [ "${pair#*=}" != "success" ]; then
              echo "::error::job ${pair%%=*} ended '${pair#*=}', not 'success'"
              status=1
            fi
          done
          exit "$status"
