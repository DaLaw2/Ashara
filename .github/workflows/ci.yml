# Ashara CI — runs the same gates a developer runs locally via `just check`
# and `just test`, so there is one definition of "the gates" with two callers.

name: CI

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: every job's token reads the repository and nothing more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # GitHub withholds repository secrets from a pull request opened from a fork, so there the
      # scan has no key and cannot run. Exactly that case is 'true'; a push to master and a
      # same-repository pull request are 'false', so the key check below still fails closed on them.
      FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

    steps:
      - name: Skip the scan on a fork pull request
        if: env.FORK_PR == 'true'
        run: |
          echo "::notice::Pull request from a fork: repository secrets are withheld, so the secret scan is skipped. It runs on the push to master after merge."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.FORK_PR != 'true'
        with:
          fetch-depth: 0

      - name: Require GITGUARDIAN_API_KEY
        if: env.FORK_PR != 'true'
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          # Fail closed on a missing key. A secret scanner that skips because
          # it has no credential reports the same clean result as one that
          # scanned and found nothing.
          if [ -z "${GITGUARDIAN_API_KEY}" ]; then
            echo "::error::GITGUARDIAN_API_KEY is not set. The secret scan cannot run, so this job fails rather than passing unscanned."
            exit 1
          fi

      - name: GitGuardian scan
        if: env.FORK_PR != 'true'
        uses: GitGuardian/ggshield-action@da20be06cafe5e8633dc24744efe1efe8d30f06b # v1.52.2
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  check:
    name: Gate
    runs-on: ubuntu-latest
    # A cap, not a budget: 20 minutes so a growing codebase hits a red gate, never this timeout.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      # A pinned release archive checked against its published SHA-256 before anything in it runs.
      - name: Install just
        env:
          JUST_VERSION: 1.44.0
          JUST_SHA256: 892d229432f5ac56f8538ab9e115ce949d20541a5a15b93432687fb62dd21d97
        run: |
          archive="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfLo "$archive" "https://github.com/casey/just/releases/download/${JUST_VERSION}/${archive}"
          echo "${JUST_SHA256}  ${archive}" | sha256sum --check --strict
          sudo tar -xzf "$archive" -C /usr/local/bin just
          rm "$archive"
          just --version

      - name: Install dependencies
        run: npm ci

      - name: Gate — typecheck + boundary lint + comment lint + knip + eslint
        run: just check

  test:
    name: Test suite (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # A cap, not a budget: one shard runs a third of the suite after its setup, and 20 minutes
    # leaves room for the suite to grow before this cap, rather than the suite, ends the run.
    timeout-minutes: 20
    strategy:
      # Every shard reports, so one shard's failure never hides another's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ashara_ci
          POSTGRES_DB: ashara_ci
          # No password, deliberately. This service lives inside the job's
          # network and is destroyed when the job ends, so a credential would
          # guard nothing, and a hardcoded one is a secret the scanner reports.
          # Do not add a password or a secret here: the correct state is that
          # there is nothing to leak.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ashara_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ashara_ci@localhost:5432/ashara_ci

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The recorded web-client session (packages/server/src/web-client.test.ts)
      # drives headless Chromium; the build is the one the pinned playwright names.
      - name: Install headless Chromium
        run: npx playwright install --with-deps --only-shell chromium

      # The podman tests run real cells, never skipped, on the podman of ubuntu-latest's runner image;
      # catatonit backs `podman run --init` and is installed explicitly rather than assumed. README.md
      # names every podman version the suite passes on, so a runner image that moves to an unnamed
      # version fails here until README.md names it. Cells run with --pull=never, so every pinned image
      # a run needs (the BaseCell config/base-cell.toml names and the images
      # packages/integration/test-images.json names) is pulled here by the script `just test-images`
      # runs; the suite's globalSetup stops the run if any is absent.
      - name: Prepare podman and the pinned test images
        run: |
          sudo apt-get update
          sudo apt-get install -y podman catatonit
          podman --version
          podman_version="$(podman --version | sed -n 's/^podman version \([0-9][0-9.]*\)$/\1/p')"
          test -n "$podman_version"
          if ! grep -qF "podman ${podman_version}" README.md; then
            echo "::error::README.md does not name podman ${podman_version}, the version this runner tests on."
            exit 1
          fi
          npx tsx packages/integration/src/test-images-pull.ts

      - name: Run migrations
        run: npx tsx scripts/migrate.ts

      # vitest assigns each file to exactly one shard by a hash of its path, so the three shards
      # together run every file once.
      - name: Test suite
        run: npx vitest run --shard=${{ matrix.shard }}/3 --reporter=default --reporter=json --outputFile=vitest-results.json

      # vitest exits non-zero on a failed test, a suite that fails to collect,
      # or zero test files, but exits 0 with skipped tests; this step closes that.
      - name: Reject skipped tests
        run: |
          node -e "
            const r = require('./vitest-results.json');
            if (typeof r.numPendingTests !== 'number') throw new Error('numPendingTests is not a number: ' + JSON.stringify(r.numPendingTests));
            if (r.numPendingTests !== 0) throw new Error(r.numPendingTests + ' skipped test(s); a skipped test is a silent hole');
          "

  # The one status to require: green only when the secret scan, the gate and every shard report
  # success. A failed, cancelled or skipped job, or a missing result, turns it red. The secret scan
  # on a fork pull request ends in success with a notice, so a fork pull request can still go green.
  ci-result:
    name: CI result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [secret-scan, check, test]
    if: always()

    steps:
      - name: Require success from the secret scan, the gate and every shard
        env:
          SECRET_SCAN_RESULT: ${{ needs.secret-scan.result }}
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          status=0
          for pair in "secret-scan=${SECRET_SCAN_RESULT}" "check=${CHECK_RESULT}" "test=${TEST_RESULT}"; do
            if [ "${pair#*=}" != "success" ]; then
              echo "::error::job ${pair%%=*} ended '${pair#*=}', not 'success'"
              status=1
            fi
          done
          exit "$status"
