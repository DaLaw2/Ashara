# Ashara CI — runs the same gates a developer runs locally via `just check`
# and `just test`, so there is one definition of "the gates" with two callers.
#
# Numeric invariants (test-count floor, skip ceiling) live in ci.toml at the
# repo root — the workflow reads them, never duplicates them.

name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ashara_ci
          POSTGRES_PASSWORD: ashara_ci
          POSTGRES_DB: ashara_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ashara_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ashara_ci:ashara_ci@localhost:5432/ashara_ci

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.1
          cache: npm

      - name: Install just
        run: |
          curl -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: Install dependencies
        run: npm ci

      - name: Debug environment
        run: |
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "tsx: $(npx tsx --version 2>&1 || echo FAIL)"
          echo "---"
          ls -la scripts/
          echo "---"
          ls node_modules/.bin/tsx || echo "tsx not in .bin"
          echo "---"
          ls -la node_modules/tsx/dist/ | head -5
          echo "---"
          # Try different invocations
          echo "=== npx tsx --eval ==="
          npx tsx -e "console.log('tsx works')" 2>&1 || true
          echo "=== node --experimental-strip-types ==="
          node --experimental-strip-types scripts/migrate.ts 2>&1 || true

      - name: Run migrations
        run: npx tsx scripts/migrate.ts

      - name: Gate — typecheck + boundary lint + knip + eslint
        run: just check

      - name: Test suite
        id: test
        run: |
          # Run vitest with JSON reporter to capture counts, plus default for human output.
          npx vitest run --reporter=default --reporter=json --outputFile=vitest-results.json
          echo "vitest_exit=0" >> "$GITHUB_OUTPUT"

      - name: Enforce test-count invariants
        if: always() && steps.test.outcome == 'success'
        run: |
          # Read floors from ci.toml — the single source of truth.
          MIN_PASSED=$(grep '^min_passed' ci.toml | head -1 | sed 's/[^0-9]//g')
          MAX_SKIPPED=$(grep '^max_skipped' ci.toml | head -1 | sed 's/[^0-9]//g')

          PASSED=$(node -e "const r=require('./vitest-results.json'); console.log(r.numPassedTests)")
          SKIPPED=$(node -e "const r=require('./vitest-results.json'); console.log(r.numPendingTests)")

          echo "Passed:  ${PASSED} (floor: ${MIN_PASSED})"
          echo "Skipped: ${SKIPPED} (ceiling: ${MAX_SKIPPED})"

          FAIL=0
          if [ "$PASSED" -lt "$MIN_PASSED" ]; then
            echo "::error::Test count ${PASSED} is below the floor of ${MIN_PASSED}. If tests were legitimately removed, update ci.toml."
            FAIL=1
          fi
          if [ "$SKIPPED" -gt "$MAX_SKIPPED" ]; then
            echo "::error::Skipped count ${SKIPPED} exceeds ceiling of ${MAX_SKIPPED}. No tests should be skipped."
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then
            exit 1
          fi
