# CI invariants — single source of truth for numeric thresholds.
#
# The GitHub Actions workflow reads this file and enforces these floors.
# Update the values here when tests are legitimately added or removed.
#
# A floor set too HIGH is caught by CI itself: it blocks legitimate green runs
# until someone updates it. A floor set too LOW is caught by nothing — it
# under-enforces in silence, and reports the same green as an accurate one.
# This file sat at 348 while the suite reached 399, so 51 tests could have
# vanished unnoticed. Raise it whenever the count legitimately moves; the cost
# of forgetting is not symmetric.

[tests]
# Minimum number of passing tests. CI fails if vitest reports fewer.
# Measured 2026-07-28 by `just test`: 420 passed / 43 files / 0 skipped.
# Update this comment in the same edit that changes the number below. It was left
# asserting 399/40 through the commit that raised the value to 412 — in a commit whose
# own message was about floors that do not match reality being caught by nothing.
min_passed = 420

# Maximum number of skipped tests. CI fails if vitest reports more.
max_skipped = 0
