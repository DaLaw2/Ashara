# The store the pinned test images live in on a host with /data (an HDD): `just test-images` pulls into
# it (packages/integration/src/test-podman-store.ts useTestImageStore), and every test run reads it as
# the additional image store of podman-test-storage.conf. Only pulls write it. Production code never
# reads this file; the default store is never touched.
[storage]
driver = "overlay"
graphroot = "/data/ashara-podman-test/storage"
runroot = "/run/user/$UID/ashara-podman-test-images"
