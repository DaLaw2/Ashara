# Ashara Model Configuration
#
# The model catalog is DB-authoritative (seeded by migration 002_seed_models.sql).
# This file contains only deployment-specific routing profiles.
#
# To add/update models, create a new migration or use the model_configs DB table.

# =============================================================================
# Routing profiles (routing-profiles story) -- static per-site model playbooks.
#
# Combo key = the deployment's ENABLED provider names, sorted and joined by
# "+" (e.g. adding ANTHROPIC_API_KEY on top of DEEPSEEK_API_KEY makes the
# combo "anthropic+deepseek"). Not a learned/scored mechanism -- DA-09 stays
# on its own data-gated track; this is a hand-authored template per combo.
#
# Site keys reuse the EXACT string each call site already tags its request
# with (llm-gateway KNOWN_LLM_SITES). That list is the single registry: a key
# outside it is rejected when this file loads, and a non-empty table below
# that omits one of its entries makes the gateway refuse to start.
# "escalation" is not a call site of its own: the reliability ladder stamps
# it on any attempt run at an ESCALATED capability tier, regardless of which
# site the base attempt used, so every escalated retry (decomposition,
# stack-derivation, alignment, ...) can be sent to one
# deliberately-chosen reliable model.
#
# A site's value is either a bare model id (applied regardless of the
# requested capability) or a per-capability table `{ <Capability> = "...",
# default = "..." }` for a site whose requests legitimately vary in
# capability across calls. agent-runner is the one such site today: it tags
# every request "agent-runner" but the per-task capability ranges over
# Light/Strong/Frontier (planning's inferCapability) -- a flat model here
# would silently downgrade a Frontier-classified task (design/schema/
# security/auth/perf) to whatever the flat entry names.
#
# A combo with no table below, or an explicitly EMPTY table, is not an error:
# every site falls through to capability-level logic. A NON-EMPTY table is a
# curated allocation and must map every known site -- a hole in it would
# silently escape to capability routing, which is how stack-derivation once
# reached Anthropic despite the reserve below.
#
# Within a table, a request whose capability has no entry AND no "default",
# or whose mapped model no searched provider offers, fails the call
# (RoutingProfileUnresolved) -- only the SITE dimension is boot-enforced.
# =============================================================================

[routing.profiles."deepseek"]
# Intentionally empty: a deepseek-only deployment gets pure capability-level
# routing, byte-identical to pre-routing-profiles behavior.

[routing.profiles."anthropic+deepseek"]
# Plan C (owner, provider-budget-cap story): DeepSeek is the agent/planning
# workhorse; Anthropic is reserved for ladder-escalated retries only, to
# protect the $20 Anthropic credit (E2E budget <= $1 total). The
# judge tier that used to hold the third Anthropic slot was removed in
# ADR-034, taking claude-opus-4-8 out of routing with it.
# Frontier-classified agent tasks stay on DeepSeek's own Frontier model
# (v4-pro) rather than downgrading to v4-flash or escaping to Anthropic.
# Agent default upgraded to V4 Pro: Flash can't produce compiling TypeScript+Hono
# code (Runs 30-32: every attempt failed tsc baseline). Pro is 12x Flash but still
# cheaper than Sonnet ($1.74/$3.48 vs $3/$15). Frontier stays on Pro (no-op).
"agent-runner" = { Frontier = "deepseek-v4-pro", default = "deepseek-v4-pro" }
"decomposition" = "deepseek-v4-flash"
"alignment" = "deepseek-v4-flash"
# Stack derivation (ADR-046) is a once-per-project, temperature-0 label
# extraction -- cheap and deterministic, and keeping it on DeepSeek preserves
# the Anthropic reserve stated above.
"stack-derivation" = "deepseek-v4-flash"
"escalation" = "claude-sonnet-4-6"
# Acceptance upgraded to V4 Pro: Sonnet 5 false-accepted with 0 completions (Run 32).
# Pro should correctly identify "nothing was built" from work item statuses.
"acceptance" = "deepseek-v4-pro"
