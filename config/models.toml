# Ashara Model Catalog
# Edit this file to add/remove models. No rebuild needed.
# Pricing last verified: 2026-07-05. FC reliability verified: 2026-07-09.
#
# capability levels: Frontier | Strong | Medium | Light
# format_group: native-fc | code-fence | text-patch
#   native-fc   — provider's native function calling API (Anthropic, OpenAI, DeepSeek V4, xAI)
#   code-fence  — model outputs ```lang:path code blocks (Gemini, small locals, flaky FC providers)
#   text-patch  — model outputs *** Begin Patch blocks (for diff-oriented models)
#
# Only providers with matching env vars (API keys) are activated.

# =============================================================================
# Providers
# =============================================================================

[providers.anthropic]
type = "anthropic"
# env: ANTHROPIC_API_KEY

[providers.openai]
type = "openai"
# env: OPENAI_API_KEY

[providers.deepseek]
type = "openai-compatible"
# env: DEEPSEEK_API_KEY, DEEPSEEK_BASE_URL (default: https://api.deepseek.com/v1)

[providers.mistral]
type = "openai-compatible"
# env: MISTRAL_API_KEY, MISTRAL_BASE_URL (default: https://api.mistral.ai/v1)

[providers.xai]
type = "openai-compatible"
# env: XAI_API_KEY, XAI_BASE_URL (default: https://api.x.ai/v1)

[providers.google]
type = "openai-compatible"
# env: GOOGLE_API_KEY, GOOGLE_BASE_URL

[providers.local]
type = "openai-compatible"
# env: LOCAL_LLM_URL

