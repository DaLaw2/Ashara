# The podman store test runs use on a host with /data: packages/integration/src/test-podman-store.ts
# points CONTAINERS_STORAGE_CONF here for every test run. Production code never reads this file; the
# server's podman uses the operator's own store.
#
# Every short-lived test container writes a container layer, a copy of its image's files owned by the
# cell's user namespace, and rows of podman's container database. graphroot is a tmpfs, so the layers
# and copies stay in memory; transient_store keeps the container database under runroot, also a tmpfs.
# The pinned images are read, never written, from the image store on /data (podman-test-images.conf),
# so a reboot empties this store and costs no pull. Nothing here touches the default store.
[storage]
driver = "overlay"
graphroot = "/dev/shm/ashara-podman-test-$UID/storage"
runroot = "/run/user/$UID/ashara-podman-test"
transient_store = true

[storage.options]
additionalimagestores = ["/data/ashara-podman-test/storage"]
