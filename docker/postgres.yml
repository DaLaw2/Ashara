name: ashara
services:
  postgres:
    container_name: ashara-db
    image: docker.io/pgvector/pgvector:pg17
    # The simulator runs up to 20 seed workers at once, each holding several sessions (scripts/simulate.ts).
    command: ["postgres", "-c", "max_connections=400"]
    ports:
      # 127.0.0.1-only binding is the sole access boundary under trust auth: a wider
      # binding lets any app on the network, an E2E-built one included, write into the
      # orchestrator's own database. Do not widen without restoring password auth.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ashara
      POSTGRES_DB: ashara
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ashara_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashara"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ashara_pgdata:
    name: ashara_pgdata
