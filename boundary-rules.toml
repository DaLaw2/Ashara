# ADR-044: Import boundary rules
# Each BC declares which @ashara/* packages it may import from.
# Composition root (server) is exempt — it wires everything.
# "shared" is the Published Language / Shared Kernel.
#
# allow          = [...]        packages this package may import
# restrict.<pkg> = [glob, ...]  package-relative files that may import <pkg>;
#                               every other file in the package is a violation.

[shared]
allow = []

[orchestrator]
# planning + development + engagement reachable ONLY through acl/ (enforced by restrict below)
# db is infrastructure, not a BC boundary
allow = ["shared", "db", "planning", "development", "engagement"]
restrict.planning = ["src/acl/*.ts"]
restrict.development = ["src/acl/*.ts"]
restrict.engagement = ["src/acl/*.ts"]

[planning]
allow = ["shared", "llm-gateway"]

[development]
allow = ["shared", "llm-gateway"]

[agent-runner]
allow = ["shared", "llm-gateway"]

[db]
allow = ["shared"]

[engagement]
allow = ["shared", "llm-gateway"]

[server]
allow = ["*"]

[llm-gateway]
allow = ["shared"]

[security]
# ADR-075 S1: db holds the ciphertext rows; the master key stays outside it.
allow = ["db"]

[finance]
# ADR-075 S2 (story s-cost-ledger-m1): llm_calls rows go through db; prices and the
# recorder port come from llm-gateway's public API (calculateCost is not moved here).
allow = ["db", "llm-gateway"]

[execution-infra]
# ADR-075 Execution Infrastructure: cells on the container substrate. Imports no other context.
allow = ["shared"]

[workplace]
# ADR-075 Workplace: the attempt loop in Z0 (each model turn through llm-gateway) with every tool on a cell.
allow = ["shared", "llm-gateway", "execution-infra"]
