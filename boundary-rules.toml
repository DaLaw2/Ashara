# ADR-044: Import boundary rules
# Each BC declares which @ashara/* packages it may import from.
# Composition root (server) is exempt — it wires everything.
# "shared" is the Published Language / Shared Kernel.
#
# allow          = [...]        packages this package may import
# restrict.<pkg> = [glob, ...]  package-relative files that may import <pkg>;
#                               every other file in the package is a violation.

[shared]
allow = []

[orchestrator]
# planning + development reachable ONLY through acl/ (enforced by restrict below)
# db is infrastructure, not a BC boundary
allow = ["shared", "db", "planning", "development"]
restrict.planning = ["src/acl/*.ts"]
restrict.development = ["src/acl/*.ts"]

[planning]
allow = ["shared", "llm-gateway"]

[development]
allow = ["shared", "llm-gateway", "memory"]

[agent-runner]
# development reachable ONLY through the ACL (ADR-044 Phase 6)
allow = ["shared", "llm-gateway", "development"]
restrict.development = ["src/acl/development-acl.ts"]

[db]
allow = ["shared"]

[engagement]
allow = ["shared", "llm-gateway"]

[memory]
allow = []

[cli]
allow = ["shared", "llm-gateway", "engagement", "planning"]

[server]
allow = ["*"]

[llm-gateway]
allow = ["shared"]
