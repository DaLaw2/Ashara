# Import boundary rules: ADR-075's context map, one section per package (ADR-044 mechanism).
# scripts/check-boundaries.ts enforces them in `just check`; scripts/boundary-probes.test.ts plants
# one violating import per forbidden package pair and per restrict rule and asserts the checker
# reports each, and holds this file's edges to the list it states. An edge added here without
# changing that list fails the test: a new edge is a decision about the map, not a lint fix.
#
# allow          = [...]        packages this package may import; only edges the map draws, plus the
#                               shared kernel (conformist) and db (generic persistence) for a
#                               context that owns tables
# restrict.<pkg> = [glob, ...]  package-relative files that may import <pkg>; every other file in
#                               the package is a violation (a downstream context reads an upstream
#                               one through its src/acl/)
# importers      = [...]        the only packages that may import this one, checked even against a
#                               wildcard `allow`; `[]` means none may
# named-only, names.<pkg>       see [integration]
#
# [stack-literals] is no package's section: it holds the stack-literal denylist (see its comment).

# --- Kernel and generic persistence -----------------------------------------------------------

[shared]
# The shared kernel: identifiers and the vocabulary every context conforms to. Imports nothing.
allow = []

[db]
# Generic persistence: connection, listener, migrations, event store and the schema per context.
allow = ["shared"]

# --- Generic and supporting contexts ----------------------------------------------------------

[model-access]
# ADR-075 Model Access (generic): providers, models, the structured-output ladder. Finance is its
# only customer, so every model call goes through Finance's guarded port; the composition root
# builds the gateway and the integration harness composes it as the root does. Every other context
# reads the model language Finance re-publishes.
allow = ["shared"]
importers = ["finance", "server", "integration"]

[finance]
# ADR-075 Finance in front of Model Access: llm_calls rows go through db; Finance measures cost,
# owns the recorder port and guards every model call; the model catalog and the gate it supplies
# come from model-access's public API, whose language Finance re-publishes to the other contexts.
allow = ["shared", "db", "model-access"]

[security]
# ADR-075 S1: db holds the ciphertext rows; the master key stays outside it.
allow = ["db"]
# Only the composition root and the integration harness may hold a key or a store. The operator
# tools in scripts/ also import it; this checker does not scan scripts/.
importers = ["server", "integration"]

[execution-infra]
# ADR-075 Execution Infrastructure: cells on the container substrate. Imports no other context.
allow = ["shared"]

[knowledge]
# ADR-075 Knowledge: findings and failed approaches. It owns its repositories; db supplies the
# connection and the schema.
allow = ["shared", "db"]

[workplace]
# ADR-075 Workplace, upstream of every role: the attempt loop in Z0, each model turn through
# Finance's guarded port, every tool on a cell (Workplace -> Execution Infrastructure). It owns its
# session log (dev_sessions); db supplies the connection and the schema.
allow = ["shared", "db", "finance", "execution-infra"]

# --- Core contexts ----------------------------------------------------------------------------

[engagement]
# ADR-075 Engagement, upstream of Delivery; its structured reads of client input go through
# Finance's guarded port. O1 (ADR-080 d3): it owns its repositories; db supplies the connection and
# the schema. O3 c (ADR-080 d3): a project's halt is Delivery's; Engagement's steps that ask for one
# read its cause in Delivery's published language (project-halt), and its block and delivered
# reports read the work item's recorded cause and task specification in Delivery's work-item
# language, only in the files listed.
allow = ["shared", "db", "finance", "delivery"]
restrict.delivery = ["src/answers.ts", "src/block-report.ts", "src/intake.ts", "src/plan-report.ts", "src/plan-report.test.ts", "src/repositories/block-report.ts", "src/repositories/delivered-report.ts", "src/stack-choice.ts"]

[organization]
# ADR-075 Organization (S3): roster, role and the capability-class vocabulary, upstream of Delivery.
# Roster derivation is Organization's language, so its structured call on the `roster` site lives
# here, through Finance's guarded port. It reads the client vision in Engagement's published
# language, and the conventions Workplace's tools enforce (stated in its role charters) in
# Workplace's published language, each through its ACL; Workplace never reads Organization.
allow = ["shared", "finance", "engagement", "workplace"]
restrict.engagement = ["src/acl/*.ts"]
restrict.workplace = ["src/acl/*.ts"]

[quality]
# ADR-075 Quality: the checks, the gates, the merge and its verification, the suite review and the
# acceptance sweep, run on cells (Quality -> Execution Infrastructure). Workplace is upstream:
# Quality supplies the ports its tools call and the verdicts they show. Its suite review calls a
# model through Finance's guarded port. It owns its repositories; db supplies the connection and
# the schema. It reads the task specification Delivery wrote and the vision items it cites only as
# their published languages (Delivery's work-item entry, Engagement's vision entry), through its
# ACL; neither entry loads the services that call Quality.
allow = ["shared", "db", "finance", "execution-infra", "workplace", "delivery", "engagement"]
restrict.delivery = ["src/acl/*.ts"]
restrict.engagement = ["src/acl/*.ts"]

[delivery]
# ADR-075 Delivery: the board, decomposition, routing and the contractor loop (its process manager).
# Engagement and Organization are upstream; Delivery reads Workplace's Outcome, an attempt's claim,
# and Quality's verdict, reads and writes Knowledge, and makes its planning calls through Finance's
# guarded port. Every other context is reachable only through src/acl/, except that the dispatcher
# (src/dispatch/) composes a task's dispatch from Workplace's attempt, Quality's verification,
# Knowledge's context and lessons, Execution Infrastructure's cells and worktrees and Finance's
# guarded model port directly. Delivery owns its repositories (O1); db supplies the connection and
# the schema.
allow = ["shared", "db", "engagement", "organization", "workplace", "quality", "knowledge", "execution-infra", "finance"]
restrict.engagement = ["src/acl/*.ts"]
restrict.organization = ["src/acl/*.ts"]
restrict.workplace = ["src/acl/*.ts", "src/dispatch/*.ts"]
restrict.quality = ["src/acl/*.ts", "src/dispatch/*.ts"]
restrict.knowledge = ["src/acl/*.ts", "src/dispatch/*.ts"]
restrict.execution-infra = ["src/acl/*.ts", "src/dispatch/*.ts"]
restrict.finance = ["src/acl/*.ts", "src/dispatch/*.ts"]

# --- Infrastructure and the test harness ------------------------------------------------------

[server]
# The composition root and the client's only interface (ADR-076): it wires every context.
allow = ["*"]
# The master key and the secret store are reached only where the server is composed and its
# startup secrets loaded, plus the web-client login's secret-name vocabulary.
restrict.security = ["src/compose.ts", "src/secrets.ts", "src/secrets.test.ts", "src/web-client.ts"]

[integration]
# Story s-independent-verify-m1 L2: the lifecycle simulator and the cross-package integration
# tests compose the real system as the composition root does, so the list is every package; a new
# package is added here by decision, never reached through a wildcard. Nothing may import them back:
# test harness code never becomes a production dependency.
allow = ["shared", "db", "model-access", "finance", "security", "execution-infra", "knowledge", "workplace", "engagement", "organization", "quality", "delivery", "server"]
importers = []
# ADR-081: a simulator oracle never imports the production predicate or report composer it judges.
# scripts/check-boundaries.ts holds every file under src/simulator/ to importing from another
# package only the symbols listed here: composition, a fake's port type, a class the simulator wraps
# to observe, and the shared vocabulary. No Engagement composer, no acceptance or block-report read
# model of db, and from Delivery only its work-item vocabulary is listed. Adding a name is a decision to review, not a
# formality. The cross-package tests (src/server/) are not held to it.
named-only = ["src/simulator/**"]
names.db = ["ClientRepository", "DEFAULT_DATABASE_URL", "MIGRATIONS_DIR", "PROJECT_BLOCK_KINDS", "PoolFactory", "SecretRepository", "TargetCheckoutClaimedElsewhere", "createDb", "runMigrations"]
names.delivery = ["BLOCKED_REASON_SOURCES", "BlockedReasonCorrupt", "OUTBOUND_TRANSITIONS", "StoredBlockedReason", "WORK_ITEM_STATUSES", "WorkItemStatus", "parseStoredBlockedReason", "parseStoredTaskSpec"]
names.engagement = ["PROJECT_STATUSES", "VisionSource"]
names.execution-infra = ["GitRunner", "ProcessRunner", "execFileGitRunner", "loadBaseCell"]
names.finance = ["SPEND_CAP_ERROR_CLASS"]
names.model-access = ["LanguageModelFactory"]
names.quality = ["AcceptanceSweep", "EXECUTION_STATUSES", "observeAcceptanceSweeps"]
names.security = ["MasterKey", "SecretStore", "clientAccessCodeSecretName", "createKeyFile", "loadMasterKey"]
names.server = ["AsharaInstance", "AsharaPorts", "composeAshara"]
names.shared = ["Clock", "ContendedWaitKind", "ContendedWaitObserver", "JsonParseFailed", "describeErrorChain", "observeContendedWaits", "parseJson"]
names.workplace = ["ATTEMPT_TERMINALS", "CHECK_MISSING_EXIT"]
# ADR-080 d10: a stand-in model answers the product's model calls, so one that imports the rule judging
# its answer (a parser, a schema, a classifier) can answer exactly what the rule accepts, and the
# oracle judging that rule stops being independent. A stand-in, and every simulator file it reaches by
# a relative value import, may import from another package only the transport and type names below,
# never a product rule; each must also be in names.<pkg>. Blind spots: a stand-in that games the rule
# by hand (writes the minimal text the rule accepts) imports nothing and passes; an `import type` edge
# is not followed; tests written from observed behaviour are not checked at all.
stand-ins = ["src/simulator/scripted-models.ts"]
stand-in-names.model-access = ["LanguageModelFactory"]
# ADR-084 decision 4: the termination invariants judge work against an oracle-owned bounds table. A
# bounds table imports nothing at all, no other package's symbol (a production bound such as the work
# ledger's DEFAULT_WORK_BUDGETS) and no other file that could hand it one, so each bound in it is the
# value its cited decision states and a production change that moves a bound moves nothing here.
bounds-tables = ["src/simulator/work-bounds.ts"]

# --- Stack literals (no package's section) ----------------------------------------------------

[stack-literals]
# CLAUDE.md "Target Generality" (ADR-080 d10, class C8): Ashara provides context and never
# prescribes a stack. scripts/check-boundaries.ts fails on any token below inside a string, template
# or regular expression literal of a non-test module under packages/<pkg>/src; comments, identifiers
# and module specifiers are not read (scripts/stack-literals.ts states why, and its blind spots).
#
# tokens.<group> = ["...", ...]   case-insensitive, matched where no letter, digit or `_` touches it
# exempt.<id>    = { file = "<repo-relative path>", tokens = ["..."], reason = "..." }
#                  a reviewed literal that names Ashara's own tooling, never the client's stack; an
#                  exempted token no literal of its file uses is itself a violation
tokens.manifest = ["package.json", "package-lock.json", "yarn.lock", "pnpm-lock.yaml", "tsconfig.json", "Cargo.toml", "Cargo.lock", "go.mod", "go.sum", "pyproject.toml", "setup.py", "requirements.txt", "Pipfile", "pom.xml", "build.gradle", "build.gradle.kts", "Gemfile", "composer.json", "CMakeLists.txt", "Makefile"]
tokens.language = ["typescript", "javascript", "node.js", "nodejs", "deno", "python", "rust", "golang", "java", "kotlin", "scala", "ruby", "php", "swift", "csharp", "c++", "haskell", "elixir", "perl"]
tokens.extension = [".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".py", ".rs", ".go", ".java", ".kt", ".scala", ".rb", ".php", ".swift", ".cs", ".c", ".h", ".cpp", ".hpp"]
tokens.toolchain = ["npm", "npx", "yarn", "pnpm", "bun", "node_modules", "tsc", "tsx", "vitest", "jest", "eslint", "prettier", "cargo", "rustc", "pip", "pip3", "poetry", "pytest", "mvn", "gradle", "javac", "go build", "go test", "go run", "cmake", "gcc", "clang", "composer", "bundle exec", "dotnet"]
exempt.delivery-unblock-hint = { file = "packages/delivery/src/acceptance.ts", tokens = ["npx", "tsx"], reason = "the operator's command for Ashara's own scripts/project.ts" }
exempt.shared-unblock-hint = { file = "packages/shared/src/contained-step.ts", tokens = ["npx", "tsx"], reason = "the operator's command for Ashara's own scripts/project.ts" }
exempt.finance-unblock-hint = { file = "packages/finance/src/errors.ts", tokens = ["npx", "tsx"], reason = "the operator's command for Ashara's own scripts/project.ts" }
exempt.engagement-grant-hint = { file = "packages/engagement/src/burn-warning.ts", tokens = ["npx", "tsx"], reason = "the operator's command for Ashara's own scripts/project.ts" }
exempt.model-access-key-hint = { file = "packages/model-access/src/build-gateway.ts", tokens = ["npx", "tsx"], reason = "the operator's command for Ashara's own scripts/secret.ts" }
exempt.security-key-length-hint = { file = "packages/security/src/errors.ts", tokens = ["npx", "tsx"], reason = "the operator's command for Ashara's own scripts/secret-key-init.ts" }
exempt.security-key-init-hint = { file = "packages/security/src/master-key.ts", tokens = ["npx", "tsx"], reason = "the operator's command for Ashara's own scripts/secret-key-init.ts" }
exempt.server-secret-hints = { file = "packages/server/src/secrets.ts", tokens = ["npx", "tsx"], reason = "the operator's commands for Ashara's own scripts/secret-key-init.ts and scripts/secret.ts" }
exempt.server-access-code-hint = { file = "packages/server/src/web-client.ts", tokens = ["npx", "tsx"], reason = "the operator's command for Ashara's own scripts/client.ts" }
exempt.server-web-client-script = { file = "packages/server/src/web-client.ts", tokens = ["javascript"], reason = "the media type of Ashara's own web client script" }
exempt.integration-leak-guard = { file = "packages/integration/src/cell-leak-guard.ts", tokens = ["vitest"], reason = "Ashara's own test runner, whose runs the leak guard tracks" }
exempt.integration-text-facts = { file = "packages/integration/src/simulator/text-facts.ts", tokens = ["composer"], reason = "the English word for a text composer that I9's coverage lists name, not PHP's Composer" }
exempt.integration-test-cells = { file = "packages/integration/src/test-cells.ts", tokens = ["vitest"], reason = "Ashara's own test runner, whose run supplies the test cell" }
