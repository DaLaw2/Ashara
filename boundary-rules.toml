exempt.integration-test-cells = { file = "packages/integration/src/test-cells.ts", tokens = ["vitest"], reason = "Ashara's own test runner, whose run supplies the test cell" }
exempt.integration-soak-runner = { file = "packages/integration/src/simulator/simulator-harness.ts", tokens = ["npx", "tsx"], reason = "the command that runs Ashara's own scripts/simulate.ts, which the soak test files compare serial and parallel" }
