# Import boundary rules: the context map, one section per package.
# scripts/check-boundaries.ts enforces them in `just check`; scripts/boundary-probes.test.ts plants
# one violating import per forbidden package pair and per restrict rule and asserts the checker
# reports each, and holds this file's edges to the list it states. An edge added here without
# changing that list fails the test: a new edge is a decision about the map, not a lint fix.
#
# allow          = [...]        packages this package may import; only edges the map draws, plus the
#                               shared kernel (conformist) and db (generic persistence) for a
#                               context that owns tables
# restrict.<pkg> = [glob, ...]  package-relative files that may import <pkg>; every other file in
#                               the package is a violation (a downstream context reads an upstream
#                               one through its src/acl/)
# entries.<pkg>  = [sub, ...]   the only entry points of <pkg> this package may import: subpaths its
#                               package.json exports, "." for its root; any other is a violation
# importers      = [...]        the only packages that may import this one, checked even against a
#                               wildcard `allow`; `[]` means none may
# named-only, names.<pkg>       see [integration]
# module.<name>  = [glob, ...]  the files of one internal module of the package; once a section
#                               declares any, every .ts file under its src/ belongs to exactly one
#                               (a test file to its subject's), and a glob matching no file fails
# module-allow.<name> = [...]   the other modules <name> may import, type-only imports included;
#                               a module without one imports none, and a cycle is a parse error;
#                               an item "<module>:<glob>" lets <name> import only those files of it
# module-entry.<name> = [glob, ...] the only files of <name> another module may import
#                               The module `entry` (the barrel) may import every module; none may import it.
# module-names.<name> = ["<pkg>[/<subpath>]:<symbol>", ...] symbols of another package's entry that
#                               only the files of module <name> may import, tests included; any other
#                               file naming one, or importing the entry by a namespace, is refused,
#                               and so is a re-export of one inside the module
# subpath-importers.<subpath> = [...] the only packages that may import @ashara/<this>/<subpath>; once a
#                               section states any, each subpath its package.json exports needs one, a
#                               relative path into the package is refused, and scripts/ may import none
# test-only-subpaths = [...]    subpaths of this package that only a *.test.ts file, the test harness
#                               (packages/integration) or another test-only entry file may import, by
#                               its @ashara/ name or by a relative path to its entry file
# classes.<pkg>  = [...]        the only classes <pkg> exports that this package may import, tests
#                               included; a namespace, default or dynamic import of <pkg>, or a
#                               relative path into it, is refused, since it names no symbol
#
# [stack-literals] is no package's section: it holds the stack-literal denylist (see its comment).

# --- Kernel and generic persistence -----------------------------------------------------------

[shared]
# The shared kernel: identifiers and the vocabulary every context conforms to. Imports nothing.
allow = []
# Its test doubles (an inert member, a recording logger, a containment in memory): no production
# path is built on one.
test-only-subpaths = ["testing"]

[db]
# Generic persistence: connection, listener, migrations, event store and the schema per context.
allow = ["shared"]
# A context's tables are its own: each schema/<context> entry admits that context, the composition
# root and the test harness, and the root entry re-exports no table a context owns. The checker holds
# each list to the [tables] owner of every table its entry declares, so a foreign table object fails
# the import here and a drizzle builder read of it cannot be written. A relational read
# (db.query.<table>) names no table object; the shared Database handle is built without a schema, so
# its query names no table and the type checker refuses that read.
subpath-importers.schema/delivery = ["delivery", "server", "integration"]
subpath-importers.schema/engagement = ["engagement", "server", "integration"]
subpath-importers.schema/execution-infra = ["execution-infra", "server", "integration"]
subpath-importers.schema/finance = ["finance", "server", "integration"]
subpath-importers.schema/knowledge = ["knowledge", "server", "integration"]
subpath-importers.schema/model-access = ["model-access", "server", "integration"]
subpath-importers.schema/organization = ["organization", "server", "integration"]
subpath-importers.schema/quality = ["quality", "server", "integration"]
subpath-importers.schema/security = ["security", "server", "integration"]
subpath-importers.schema/workplace = ["workplace", "server", "integration"]

# --- Generic and supporting contexts ----------------------------------------------------------

[model-access]
# Model Access (generic): providers, models, the structured-output ladder. Finance is its
# only customer, so every model call goes through Finance's guarded port; the composition root
# builds the gateway and the integration harness composes it as the root does. Every other context
# reads the model language Finance re-publishes. Its catalog tables go through db.
allow = ["shared", "db"]
importers = ["finance", "server", "integration"]

[finance]
# Finance in front of Model Access: llm_calls rows go through db; Finance measures cost,
# owns the recorder port and guards every model call; the model catalog and the gate it supplies
# come from model-access's public API, whose language Finance re-publishes to the other contexts.
allow = ["shared", "db", "model-access"]

[security]
# Security: db holds the ciphertext rows and the client login and session rows; the master key
# stays outside it. shared gives the error chain a login body that is not JSON is logged with.
allow = ["shared", "db"]
# Only the composition root and the integration harness may hold a key or a store. The operator
# tools in scripts/ also import it; this checker reads scripts/ only for subpath-importers.
importers = ["server", "integration"]

[execution-infra]
# Execution Infrastructure: cells on the container substrate. Imports no other context; its
# environment builds go through db.
allow = ["shared", "db"]
# Its modules by business purpose: the cells on the container substrate, the target checkout and task
# worktrees on the host, the environment versions (a cell on a checkout), and the package's typed errors,
# its kernel. A cell reads the host only to snapshot a repository into itself; checkout's lock and tree
# reads stay behind its worktree and repository entry files.
module.cells       = ["src/podman.ts", "src/cell-probes.ts", "src/cell-probes-callers.test.ts", "src/process-runner.ts", "src/cell-backend.ts", "src/cell-limits.ts", "src/cells.ts", "src/base-cell.ts", "src/workspace-path.ts"]
module.checkout    = ["src/worktree.ts", "src/tree-read.ts", "src/checkout-lock.ts", "src/host-git.ts", "src/target-repo.ts", "src/worktree-boundary.test.ts"]
module.environment = ["src/environment-build.ts", "src/environment-build-repository.ts", "src/environment.ts", "src/current-environment.ts", "src/checkout-cell.ts", "src/environment-report.ts"]
module.errors      = ["src/errors.ts"]
module.entry       = ["src/index.ts"]
module-allow.environment = ["cells", "checkout", "errors"]
module-allow.cells       = ["checkout:src/host-git.ts", "errors"]
module-allow.checkout    = ["errors"]
module-entry.checkout    = ["src/host-git.ts", "src/target-repo.ts", "src/worktree.ts"]

[knowledge]
# Knowledge: findings and failed approaches. It owns its repositories; db supplies the
# connection and the schema.
allow = ["shared", "db"]

[workplace]
# Workplace, upstream of every role: the attempt loop in Z0, each model turn through
# Finance's guarded port, every tool on a cell (Workplace -> Execution Infrastructure). It owns its
# session log (dev_sessions); db supplies the connection and the schema.
allow = ["shared", "db", "finance", "execution-infra"]

# --- Core contexts ----------------------------------------------------------------------------

[engagement]
# Engagement, upstream of Delivery; its structured reads of client input go through
# Finance's guarded port. It owns its repositories; db supplies the connection and
# the schema. A project's halt is Delivery's; Engagement's steps that ask for one
# read its cause in Delivery's published language (project-halt), and its block and delivered reports and the early-warning register
# read the work item's recorded cause and task specification in Delivery's work-item
# language; its predicates, its lifecycle guard and the reads that admit a project by its halt
# or a task by the plan it belongs to read them in Delivery's published predicates, and what its
# reports and its told record name of the board in Delivery's published reads; each only in the
# files listed. The early-warning register reads which revision of a task's stored checks is in force
# and what each decides in Quality's published stored-checks language, and the reports and the told
# record read the sweeps, their evidence and the check disputes in Quality's published reads, only in
# the repositories listed. Quality judges every guarantee's verdict; Engagement renders it, reading and
# persisting it only through Quality's published verdicts, and never imports the verdict computation:
# it reaches Quality only through the entries listed, never through the root that exports it. The
# contract's guarantee vocabulary records, when a guarantee is proposed, Quality's decision of whether
# Ashara can verify it, read from the published verdicts.
allow = ["shared", "db", "finance", "delivery", "quality"]
restrict.delivery = ["src/answers.ts", "src/block-report.ts", "src/block-report.test.ts", "src/client-change.ts", "src/client-receipt.ts", "src/client-receipt.test.ts", "src/inbound-policy.ts", "src/inbound-policy.test.ts", "src/intake.ts", "src/plan-report.ts", "src/plan-report.test.ts", "src/predicates.ts", "src/project-lifecycle.ts", "src/repositories/block-report.ts", "src/repositories/burn-warning.ts", "src/repositories/client-answer.ts", "src/repositories/client-change.ts", "src/repositories/client-message.ts", "src/repositories/client-receipt.ts", "src/repositories/delivered-report.ts", "src/repositories/early-warning.ts", "src/repositories/plan-report.ts", "src/repositories/stack-choice.ts", "src/repositories/terminal-report.ts", "src/repositories/told-report.ts", "src/stack-choice.ts"]
restrict.quality = ["src/guarantee-report.ts", "src/repositories/block-report.ts", "src/repositories/delivered-report.ts", "src/repositories/early-warning.ts", "src/repositories/guarantee-report.ts", "src/repositories/terminal-report.ts", "src/repositories/told-report.ts", "src/vision-language/guarantee.ts"]
entries.quality = ["published-reads", "published-verdicts", "stored-checks"]
# Its modules by business purpose: the vision (the contract, its published language), the intake that
# reads a tender into the first vision, the client's inbound messages after it (answers, stops, and changes read
# into corrections of the contract), the reports back, and the client channel that every message is
# written to and read from.
# Every module reads the vision; intake reads only the client channel. The client's
# stop is answered with a terminal message, which the reports list and post. The
# published predicates (a project at work, a stop or an answer awaiting the Liaison, the first plan
# told), the decision of when each inbound message is read and what the client is told of it, and the
# vocabulary of the subjects a report is on import no other module; intake, inbound and reports admit
# projects and messages by them, word a message's fate by them and name a report's subject in it.
# The client channel alone holds the client_messages table object: intake, inbound and reports
# consume, post and read a message only through its entries, so no writer reaches consumed_at but
# the one that takes the project's lock and the policy's decision.
module.vision  = ["src/vision.ts", "src/vision-language/*.ts", "src/repositories/vision.ts"]
module.intake  = ["src/intake.ts", "src/repositories/tender-intake.ts"]
module.client-messages = ["src/repositories/client-message.ts"]
module.inbound = ["src/answers.ts", "src/client-*.ts", "src/correction.ts", "src/project-lifecycle.ts", "src/repositories/client-answer.ts", "src/repositories/client-change.ts", "src/repositories/client-receipt.ts", "src/repositories/client-stop.ts"]
module.reports = ["src/plan-report.ts", "src/block-report.ts", "src/delivered-report.ts", "src/burn-warning.ts", "src/stack-choice.ts", "src/early-warning.ts", "src/repositories/block-report.ts", "src/repositories/delivered-report.ts", "src/repositories/burn-warning.ts", "src/repositories/stack-choice.ts", "src/repositories/early-warning.ts", "src/guarantee-report.ts", "src/repositories/guarantee-report.ts", "src/repositories/told-report.ts", "src/repositories/plan-report.ts", "src/stop-report.ts", "src/terminal-report.ts", "src/repositories/terminal-report.ts"]
module.predicates = ["src/predicates.ts", "src/report-subjects.ts", "src/inbound-policy.ts"]
module.ports   = ["src/ports.ts"]
module.entry   = ["src/index.ts", "src/model-schemas.ts", "src/message-reads.ts"]
module-allow.intake  = ["vision", "client-messages", "predicates"]
module-allow.inbound = ["vision", "client-messages", "reports", "predicates", "ports"]
module-allow.reports = ["vision", "client-messages", "predicates"]
module-allow.client-messages = ["predicates"]
module-names.client-messages = ["db/schema/engagement:clientMessages"]

[organization]
# Organization: roster, role and the capability-class vocabulary, upstream of Delivery.
# Roster derivation is Organization's language, so its structured call on the `roster` site lives
# here, through Finance's guarded port. It reads the client vision in Engagement's published
# language, and the conventions Workplace's tools enforce (stated in its role charters) in
# Workplace's published language, each through its ACL; Workplace never reads Organization. Its
# roster goes through db.
allow = ["shared", "db", "finance", "engagement", "workplace"]
restrict.engagement = ["src/acl/*.ts"]
restrict.workplace = ["src/acl/*.ts"]

[quality]
# Quality: the checks, the gates, the merge and its verification, the suite review and the
# acceptance sweep, run on cells (Quality -> Execution Infrastructure). Workplace is upstream:
# Quality supplies the ports its tools call and the verdicts they show. Its suite review calls a
# model through Finance's guarded port. It owns its repositories; db supplies the connection and
# the schema. It reads the task specification Delivery wrote and the vision items it cites only as
# their published languages (Delivery's work-item entry, Engagement's vision entry), through its
# ACL; neither entry loads the services that call Quality.
allow = ["shared", "db", "finance", "execution-infra", "workplace", "delivery", "engagement"]
restrict.delivery = ["src/acl/*.ts"]
restrict.engagement = ["src/acl/*.ts"]
# Its modules by business purpose: the merge gate and its verification, the verdict Delivery routes a
# dispatch on, a task's stored checks, the suite review, the environment definition and its gate, and
# the acceptance sweep's records (the sweep itself runs in the verification module, src/verification/), the
# reviewer record, written beside the evidence a re-authored check revision or a failed sweep is, the
# verdict on each guarantee and the coverage acceptance requires, and its published reads and verdicts.
module.verification   = ["src/verification/*.ts", "src/merge.ts", "src/gates/*.ts", "src/settled-branches.ts", "src/host-git.test.ts", "src/merge-queue.test.ts", "src/workspace-*.test.ts"]
module.verdict        = ["src/dispatch-result.ts", "src/fault-class.ts", "src/task-verdict.ts"]
module.checks         = ["src/task-checks.ts", "src/check-verdict.ts", "src/public-interface.ts", "src/scaffold-placeholder.ts", "src/stored-checks.ts", "src/repositories/task-check.ts", "src/repositories/check-set-freeze.ts", "src/repositories/check-dispute.ts"]
module.suite-review   = ["src/suite-review.ts", "src/repositories/suite-review.ts", "src/testing.ts"]
module.environment    = ["src/environment-check.ts", "src/environment-verdict.ts", "src/environment-definition.ts"]
module.acceptance     = ["src/repositories/acceptance.ts"]
module.reviewer-record = ["src/repositories/reviewer-outcome.ts"]
module.acl            = ["src/acl/*.ts"]
module.guarantee-verdict = ["src/guarantee-verdict.ts"]
module.published      = ["src/published-reads.ts", "src/published-verdicts.ts"]
module.entry          = ["src/index.ts"]
module-allow.verification = ["verdict", "checks", "environment", "suite-review", "acl"]
module-allow.verdict      = ["checks", "environment", "acl"]
module-allow.suite-review = ["checks", "acl"]
module-allow.checks       = ["acl", "reviewer-record"]
module-allow.acceptance   = ["verification", "reviewer-record", "guarantee-verdict", "acl"]
module-allow.guarantee-verdict = ["acl"]
module-allow.published    = ["guarantee-verdict", "acl"]
module-entry.checks       = ["src/task-checks.ts", "src/check-verdict.ts", "src/public-interface.ts", "src/scaffold-placeholder.ts", "src/repositories/*.ts"]
# Its SuiteReviewer test builder: only a test or the test harness imports it; production constructs its reviewer.
test-only-subpaths = ["testing"]

[delivery]
# Delivery: the board, decomposition, routing and the contractor loop (its process manager).
# Engagement and Organization are upstream; Delivery reads Workplace's Outcome, an attempt's claim,
# and Quality's verdict, reads and writes Knowledge, and makes its planning calls through Finance's
# guarded port. Every other context is reachable only through src/acl/, except that the dispatcher
# (src/dispatch/) composes a task's dispatch from Workplace's attempt, Quality's verification,
# Knowledge's context and lessons, Execution Infrastructure's cells and worktrees and Finance's
# guarded model port directly. Delivery owns its repositories; db supplies the connection and
# the schema.
allow = ["shared", "db", "engagement", "organization", "workplace", "quality", "knowledge", "execution-infra", "finance"]
restrict.engagement = ["src/acl/*.ts"]
restrict.organization = ["src/acl/*.ts"]
restrict.workplace = ["src/acl/*.ts", "src/dispatch/*.ts"]
restrict.quality = ["src/acl/*.ts", "src/dispatch/*.ts"]
restrict.knowledge = ["src/acl/*.ts", "src/dispatch/*.ts"]
restrict.execution-infra = ["src/acl/*.ts", "src/dispatch/*.ts"]
restrict.finance = ["src/acl/*.ts", "src/dispatch/*.ts"]
# Quality's verification jobs and sweepers reach the dispatcher only as ports the composition root
# builds (server's compose-core-loop.ts), a check task's record of its definitions among them:
# Delivery imports no class of Quality but these, the typed errors of a verification fault and an
# unprepared conflict retry it raises and reads.
classes.quality = ["ConflictRetryUnprepared", "VerificationInfrastructureFault"]
# Its inert test builders: only a test or the test harness imports them, so no production loop is built on one.
test-only-subpaths = ["testing"]

# --- Evaluation, outside the builder ----------------------------------------------------------

[evaluation]
# Evaluation: the trust measurement (the trust ledger and record, the blind mapping and the tender
# pick they read) and the run report with its read model, computed outside the builder. It reads each
# context only through what that context publishes for readers: Delivery's published reads and
# predicates, the other contexts' root entries, never a schema subpath (db's subpath-importers) and
# never a class (a repository included), so every row it reads comes through its owner's typed read.
# No package may import it, the composition root and the test harness included, so nothing the
# builder runs can read a trust number; the operator commands in scripts/ are its only callers.
allow = ["shared", "db", "finance", "workplace", "engagement", "quality", "delivery"]
importers = []
entries.delivery = ["predicates", "reads"]
entries.engagement = ["."]
entries.quality = ["."]
classes.db = []
classes.finance = []
classes.workplace = []
classes.engagement = []
classes.quality = []
classes.delivery = []

# --- Infrastructure and the test harness ------------------------------------------------------

[server]
# The composition root and the client's only interface: it wires every context.
allow = ["*"]
# Security is reached only where the server is composed and its startup secrets loaded, and where
# the HTTP surface mounts Security's bearer check and the web client's login and session.
restrict.security = ["src/app.ts", "src/compose.ts", "src/secrets.ts", "src/secrets.test.ts", "src/web-client.ts"]

[integration]
# The lifecycle simulator and the cross-package integration
# tests compose the real system as the composition root does, so the list is every package but evaluation, which
# none may import; a new package is added here by decision, never reached through a wildcard. Nothing may import them back:
# test harness code never becomes a production dependency.
allow = ["shared", "db", "model-access", "finance", "security", "execution-infra", "knowledge", "workplace", "engagement", "organization", "quality", "delivery", "server"]
importers = []
# A simulator oracle never imports the production predicate or report composer it judges.
# scripts/check-boundaries.ts holds every file under src/simulator/ to importing from another
# package only the symbols listed here: composition, a fake's port type, a class the simulator wraps
# to observe, and the shared vocabulary. No Engagement composer, no acceptance or block-report read
# model of db, and from Delivery only its work-item vocabulary is listed. Adding a name is a decision to review, not a
# formality. The cross-package tests (src/server/) are not held to it. The *_MODEL_SCHEMAS registries,
# offeredToolSchemas and wireSchemaOf are what Ashara sends a model, judged by the providers' refusal
# table (schemaRefusalsFor, PROVIDER_TYPES) at a run's start (model-schemas.ts): the gateway refuses
# such a schema before any stand-in sees it, so the oracle judges the sent schemas themselves.
# TenderIntake is the class a code plant patches (plants.ts intake-second-reading-dropped): the plant
# replaces its second reading, and no oracle reads anything of it. contendedWait is read only to see
# that a run put the process's wait observer back: with none installed it returns its argument.
# HoldEvidence is imported as a type only, so the coverage line of its arms cannot drift from the union.
named-only = ["src/simulator/**"]
names.db = ["ClientRepository", "Database", "MIGRATIONS_DIR", "PROJECT_BLOCK_KINDS", "PoolFactory", "TargetCheckoutClaimedElsewhere", "createDb", "resolveTestDatabaseUrl", "runMigrations"]
names.delivery = ["BLOCKED_REASON_SOURCES", "BlockedReasonCorrupt", "DELIVERY_MODEL_SCHEMAS", "OUTBOUND_TRANSITIONS", "StoredBlockedReason", "WORK_ITEM_STATUSES", "WorkItemStatus", "parseStoredBlockedReason", "parseStoredTaskSpec"]
names.engagement = ["ENGAGEMENT_MODEL_SCHEMAS", "PROJECT_STATUSES", "TenderIntake", "VisionSource"]
names.execution-infra = ["GitRunner", "ProcessRunner", "execFileGitRunner", "loadBaseCell"]
names.finance = ["SPEND_CAP_ERROR_CLASS"]
names.model-access = ["LanguageModelFactory", "PROVIDER_TYPES", "ProviderType", "schemaRefusalsFor", "wireSchemaOf"]
names.organization = ["ORGANIZATION_MODEL_SCHEMAS"]
names.quality = ["AcceptanceSweep", "EXECUTION_STATUSES", "QUALITY_MODEL_SCHEMAS", "observeAcceptanceSweeps"]
names.security = ["MasterKey", "SecretRepository", "SecretStore", "clientAccessCodeSecretName", "createKeyFile", "loadMasterKey"]
names.server = ["AsharaInstance", "AsharaPorts", "composeAshara"]
names.shared = ["Clock", "ContendedWaitKind", "ContendedWaitObserver", "JsonParseFailed", "LogRecord", "LogSink", "contendedWait", "describeErrorChain", "logRecordSchema", "observeContendedWaits", "parseJson"]
names.workplace = ["ATTEMPT_TERMINALS", "CHECK_MISSING_EXIT", "HoldEvidence", "offeredToolSchemas"]
# A stand-in model answers the product's model calls, so one that imports the rule judging
# its answer (a parser, a schema, a classifier) can answer exactly what the rule accepts, and the
# oracle judging that rule stops being independent. A stand-in, and every simulator file it reaches by
# a relative value import, may import from another package only the transport and type names below,
# never a product rule; each must also be in names.<pkg>. Blind spots: a stand-in that games the rule
# by hand (writes the minimal text the rule accepts) imports nothing and passes; an `import type` edge
# is not followed; tests written from observed behaviour are not checked at all. schemaRefusalsFor is
# the providers' refusal of the schema a request carries, which a stand-in applies as the transport it
# stands in for: it judges what Ashara sends, never the stand-in's answer.
stand-ins = ["src/simulator/scripted-models.ts", "src/simulator/stand-ins/*.ts"]
stand-in-names.model-access = ["LanguageModelFactory", "ProviderType", "schemaRefusalsFor"]
# The termination invariants judge work against an oracle-owned bounds table. A
# bounds table imports nothing at all, no other package's symbol (a production bound such as the work
# ledger's DEFAULT_WORK_BUDGETS) and no other file that could hand it one, so each bound in it is the
# value its cited decision states and a production change that moves a bound moves nothing here.
bounds-tables = ["src/simulator/work-bounds.ts"]


# --- Table ownership (no package's section) ---------------------------------------------------

[tables]
# Every insert, update or delete a context's source issues lands on a table that context owns;
# anything it does to another context's table goes through that owner's exported write entry or
# typed read. scripts/check-boundaries.ts fails on a write to a table another package owns, and on a
# raw SQL read of one that no allowed edge below admits; a drizzle builder read needs the table
# object, which [db] subpath-importers keep inside its owner, and a relational read (db.query) has no
# table on the shared Database handle, which is built without a schema
# (scripts/table-ownership.ts states what is read and its blind spots). Every table a
# packages/db/src/schema/<module>.ts declares has one entry: owned by <module> when it is a package,
# otherwise by "db" (generic persistence, reached through db's repositories) or "shared".
#
# <table>   = "<owner>"   the package that owns it, "db", or "shared": projects is the record every
#                         context keys its rows by, and domain_events the log every context appends to
# edge.<id> = { file = "<repo-relative path>", tables = ["..."], reason = "..." }
#                         a read of another context's table the context map allows, with the
#                         relationship that allows it; an edge table no read of its file names is
#                         itself a violation. There is no exemption: a read the map does not draw
#                         goes through the owner's typed read.
client_login_failures = "db"
clients = "db"
client_sessions = "db"
step_faults = "db"
correction_holds = "delivery"
dependencies = "delivery"
plan_repairs = "delivery"
plan_revisions = "delivery"
project_blocks = "delivery"
project_plans = "delivery"
work_items = "delivery"
client_messages = "engagement"
delivered_report_attempts = "engagement"
intake_readings = "engagement"
told_reports = "engagement"
vision_documents = "engagement"
vision_revisions = "engagement"
work_burn_warnings = "engagement"
environment_builds = "execution-infra"
llm_calls = "finance"
work_grants = "finance"
failed_approaches = "knowledge"
knowledge_entries = "knowledge"
model_configs = "model-access"
model_dated_prices = "model-access"
model_price_tiers = "model-access"
model_price_windows = "model-access"
provider_configs = "model-access"
roster_roles = "organization"
acceptance_sweeps = "quality"
acceptance_sweep_faults = "quality"
terminal_sweep_faults = "quality"
check_disputes = "quality"
check_set_freezes = "quality"
guarantee_evidence = "quality"
guarantee_verdicts = "quality"
held_set_rejections = "quality"
reviewer_outcomes = "quality"
suite_review_claims = "quality"
suite_review_findings = "quality"
suite_review_judgements = "quality"
task_checks = "quality"
undecided_item_claims = "quality"
undecided_items = "quality"
secrets = "security"
dev_sessions = "workplace"
domain_events = "shared"
projects = "shared"
# Finance is Model Access's only customer and re-publishes its model language to every other context
# (the [finance] and [model-access] sections): the attempt grade is that language read from the catalog.
edge.finance-model-catalog = { file = "packages/finance/src/attempt-grade.ts", tables = ["model_configs"], reason = "Finance, the gateway in front of Model Access, reads the catalog's two grades as the one scalar expression every reader of an attempt's grade embeds" }
# --- Stack literals (no package's section) ----------------------------------------------------

[homes]
# Name = "package": the one package that declares the name, because it is that context's language.
# Any other package's source (tests aside) that declares it, or names it in an export list, is a
# copy or a re-export shim left behind by a move. A name its home no longer declares is a stale entry.
# The dispatch plan is Delivery's; the check task's plan inside it stays Quality's CheckAuthoring.
WorkPlan = "delivery"
DispatchWork = "delivery"
agentWorkOf = "delivery"
# A plan's task counts are Delivery's board; the Liaison's first-plan report reads them as published.
PlanTaskCounts = "delivery"
# The bearer check, a login's source network, the client's login and session are Security's; the
# server only mounts them.
bearerAuth = "security"
sourceNetwork = "security"
createClientSessionRoutes = "security"
CLIENT_SESSION_COOKIE = "security"
# The cycle's step names are the kernel's: Engagement's and Organization's steps name theirs beside
# Delivery's, and Organization may not import Delivery.
CycleStep = "shared"

[stack-literals]
# CLAUDE.md "Target Generality": Ashara provides context and never
# prescribes a stack. scripts/check-boundaries.ts fails on any token below inside a string, template
# or regular expression literal of a non-test module under packages/<pkg>/src; comments, identifiers
# and module specifiers are not read (scripts/stack-literals.ts states why, and its blind spots).
#
# tokens.<group> = ["...", ...]   case-insensitive, matched where no letter, digit or `_` touches it
# exempt.<id>    = { file = "<repo-relative path>", tokens = ["..."], reason = "..." }
#                  a reviewed literal that names Ashara's own tooling, never the client's stack; an
#                  exempted token no literal of its file uses is itself a violation
tokens.manifest = ["package.json", "package-lock.json", "yarn.lock", "pnpm-lock.yaml", "tsconfig.json", "Cargo.toml", "Cargo.lock", "go.mod", "go.sum", "pyproject.toml", "setup.py", "requirements.txt", "Pipfile", "pom.xml", "build.gradle", "build.gradle.kts", "Gemfile", "composer.json", "CMakeLists.txt", "Makefile"]
tokens.language = ["typescript", "javascript", "node.js", "nodejs", "deno", "python", "rust", "golang", "java", "kotlin", "scala", "ruby", "php", "swift", "csharp", "c++", "haskell", "elixir", "perl"]
tokens.extension = [".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".py", ".rs", ".go", ".java", ".kt", ".scala", ".rb", ".php", ".swift", ".cs", ".c", ".h", ".cpp", ".hpp"]
tokens.toolchain = ["npm", "npx", "yarn", "pnpm", "bun", "node_modules", "tsc", "tsx", "vitest", "jest", "eslint", "prettier", "cargo", "rustc", "pip", "pip3", "poetry", "pytest", "mvn", "gradle", "javac", "go build", "go test", "go run", "cmake", "gcc", "clang", "composer", "bundle exec", "dotnet"]
exempt.delivery-unblock-hint = { file = "packages/delivery/src/acceptance.ts", tokens = ["npx", "tsx"], reason = "the operator's command for Ashara's own scripts/project.ts" }
exempt.shared-unblock-hint = { file = "packages/shared/src/contained-step.ts", tokens = ["npx", "tsx"], reason = "the operator's command for Ashara's own scripts/project.ts" }
exempt.finance-unblock-hint = { file = "packages/finance/src/errors.ts", tokens = ["npx", "tsx"], reason = "the operator's command for Ashara's own scripts/project.ts" }
exempt.engagement-grant-hint = { file = "packages/engagement/src/burn-warning.ts", tokens = ["npx", "tsx"], reason = "the operator's command for Ashara's own scripts/project.ts" }
exempt.model-access-key-hint = { file = "packages/model-access/src/build-gateway.ts", tokens = ["npx", "tsx"], reason = "the operator's command for Ashara's own scripts/secret.ts" }
exempt.security-key-length-hint = { file = "packages/security/src/errors.ts", tokens = ["npx", "tsx"], reason = "the operator's command for Ashara's own scripts/secret-key-init.ts" }
exempt.security-key-init-hint = { file = "packages/security/src/master-key.ts", tokens = ["npx", "tsx"], reason = "the operator's command for Ashara's own scripts/secret-key-init.ts" }
exempt.server-secret-hints = { file = "packages/server/src/secrets.ts", tokens = ["npx", "tsx"], reason = "the operator's commands for Ashara's own scripts/secret-key-init.ts and scripts/secret.ts" }
exempt.evaluation-trust-ledger-usage = { file = "packages/evaluation/src/trust-ledger.ts", tokens = ["npx", "tsx"], reason = "the operator's command for Ashara's own scripts/trust-ledger.ts" }
exempt.evaluation-trust-record-usage = { file = "packages/evaluation/src/trust-record.ts", tokens = ["npx", "tsx"], reason = "the operator's command for Ashara's own scripts/trust-record.ts" }
exempt.evaluation-pool-mapping-usage = { file = "packages/evaluation/src/pool-mapping.ts", tokens = ["npx", "tsx"], reason = "the operator's commands for Ashara's own scripts/pool-mapping.ts" }
exempt.security-access-code-hint = { file = "packages/security/src/client-session.ts", tokens = ["npx", "tsx"], reason = "the operator's command for Ashara's own scripts/client.ts" }
exempt.server-web-client-script = { file = "packages/server/src/web-client.ts", tokens = ["javascript"], reason = "the media type of Ashara's own web client script" }
