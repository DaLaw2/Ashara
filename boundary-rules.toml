# ADR-044: Import boundary rules
# Each BC declares which @ashara/* packages it may import from.
# Composition root (server) is exempt — it wires everything.
# "shared" is the Published Language / Shared Kernel.
#
# allow          = [...]        packages this package may import
# restrict.<pkg> = [glob, ...]  package-relative files that may import <pkg>;
#                               every other file in the package is a violation.

[shared]
allow = []

[delivery]
# ADR-075 Delivery: the board, decomposition, routing and the contractor loop (its process manager).
# Every other context is reachable ONLY through acl/ (enforced by restrict below), except that the
# dispatcher (src/dispatch/) composes a task's dispatch from Workplace's attempt, Quality's
# verification, Knowledge's context and lessons, Execution Infrastructure's cells and worktrees and
# Finance's guarded model port directly. Model Access is generic: the structured-output ladder.
# Delivery owns its repositories (O1); db supplies the connection and the schema.
# ADR-075 context map: Organization is upstream (who owns a WorkKind), Engagement upstream of both
# (the client vision as its published VisionVersion); Delivery reads Workplace's Outcome, an
# attempt's claim, and Quality's verdict.
allow = ["shared", "db", "engagement", "organization", "workplace", "quality", "knowledge", "execution-infra", "finance", "model-access"]
restrict.engagement = ["src/acl/*.ts"]
restrict.organization = ["src/acl/*.ts"]
restrict.workplace = ["src/acl/*.ts", "src/dispatch/*.ts"]
restrict.quality = ["src/acl/*.ts", "src/dispatch/*.ts"]
restrict.knowledge = ["src/acl/*.ts", "src/dispatch/*.ts"]
restrict.execution-infra = ["src/acl/*.ts", "src/dispatch/*.ts"]
restrict.finance = ["src/acl/*.ts", "src/dispatch/*.ts"]

[quality]
# ADR-075 Quality: the checks, the gates, the merge and its verification, the suite review and the
# acceptance sweep, run on cells (execution-infra). Workplace is upstream: Quality supplies the ports
# its tools call and the verdicts they show. Quality owns its repositories; db supplies the
# connection and the schema. It reads the task specification Delivery wrote and the vision items
# it cites only as their published languages (Delivery's work-item entry, Engagement's vision entry),
# through its ACL; neither entry loads the services that call Quality.
allow = ["shared", "db", "finance", "model-access", "execution-infra", "workplace", "delivery", "engagement"]
restrict.delivery = ["src/acl/*.ts"]
restrict.engagement = ["src/acl/*.ts"]

[knowledge]
# ADR-075 Knowledge: findings and failed approaches. It owns its repositories; db supplies the
# connection and the schema.
allow = ["shared", "db"]

[db]
allow = ["shared"]

[engagement]
# O1 (ADR-080 d3): Engagement owns its repositories; db supplies the connection and the schema.
# O3 c: a project's halt is Delivery's; Engagement's steps that ask for one read its cause in
# Delivery's published language (project-halt), and only there.
allow = ["shared", "finance", "model-access", "db", "delivery"]
# Its block and delivered reports read the work item's recorded cause and task specification in
# Delivery's work-item language.
restrict.delivery = ["src/answers.ts", "src/block-report.ts", "src/intake.ts", "src/plan-report.ts", "src/plan-report.test.ts", "src/repositories/block-report.ts", "src/repositories/delivered-report.ts", "src/stack-choice.ts"]

[server]
allow = ["*"]
# The master key and the secret store are reached only where the server is composed and its
# startup secrets loaded, plus the web-client login's secret-name vocabulary.
restrict.security = ["src/compose.ts", "src/secrets.ts", "src/secrets.test.ts", "src/web-client.ts"]

[model-access]
allow = ["shared"]

[security]
# ADR-075 S1: db holds the ciphertext rows; the master key stays outside it.
allow = ["db"]
# Only the composition root and the integration harness may hold a key or a store. The operator
# tools in scripts/ also import it; this checker does not scan scripts/.
importers = ["server", "integration"]

[finance]
# ADR-075 Finance in front of Model Access: llm_calls rows go through db; Finance measures cost,
# owns the recorder port and guards every model call; the model catalog and the gate it supplies
# come from model-access's public API.
allow = ["db", "shared", "model-access"]

[execution-infra]
# ADR-075 Execution Infrastructure: cells on the container substrate. Imports no other context.
allow = ["shared"]

[workplace]
# ADR-075 Workplace: the attempt loop in Z0 (each model turn through Finance's guarded port) with every tool on a cell.
# It owns its session log (dev_sessions); db supplies the connection and the schema.
allow = ["shared", "db", "finance", "model-access", "execution-infra"]

[organization]
# ADR-075 Organization (S3): roster, role and the capability-class vocabulary. Roster derivation is
# Organization's language, so its structured call on the `roster` site lives here, through Finance's
# guarded port like Engagement's and Delivery's own sites.
# Its role charters state the conventions Workplace's tools enforce, read from Workplace's published
# language through its ACL; Workplace never reads Organization.
allow = ["shared", "finance", "model-access", "engagement", "workplace"]
restrict.engagement = ["src/acl/*.ts"]
restrict.workplace = ["src/acl/*.ts"]

[integration]
# Story s-independent-verify-m1 L2: the lifecycle simulator and the cross-package integration
# tests compose the real system, so they may import whatever the composition root wires. Nothing
# may import them back: test harness code never becomes a production dependency.
allow = ["*"]
importers = []
# ADR-081: a simulator oracle never imports the production predicate or report composer it judges.
# scripts/check-boundaries.ts holds every file under src/simulator/ to importing from another
# package only the symbols listed here: composition, a fake's port type, a class the simulator wraps
# to observe, and the shared vocabulary. No Engagement composer, no acceptance or block-report read
# model of db, nothing from Delivery is listed. Adding a name is a decision to review, not a
# formality. The cross-package tests (src/server/) are not held to it.
named-only = ["src/simulator/**"]
names.db = ["ClientRepository", "DEFAULT_DATABASE_URL", "MIGRATIONS_DIR", "PROJECT_BLOCK_KINDS", "PoolFactory", "SecretRepository", "TargetCheckoutClaimedElsewhere", "createDb", "runMigrations"]
names.delivery = ["BLOCKED_REASON_SOURCES", "BlockedReasonCorrupt", "OUTBOUND_TRANSITIONS", "StoredBlockedReason", "WORK_ITEM_STATUSES", "WorkItemStatus", "parseStoredBlockedReason", "parseStoredTaskSpec"]
names.engagement = ["PROJECT_STATUSES", "VisionSource"]
names.execution-infra = ["GitRunner", "ProcessRunner", "execFileGitRunner", "loadBaseCell"]
names.finance = ["SPEND_CAP_ERROR_CLASS"]
names.model-access = ["LanguageModelFactory"]
names.quality = ["AcceptanceSweep", "EXECUTION_STATUSES", "observeAcceptanceSweeps"]
names.security = ["MasterKey", "SecretStore", "clientAccessCodeSecretName", "createKeyFile", "loadMasterKey"]
names.server = ["AsharaInstance", "AsharaPorts", "composeAshara"]
names.shared = ["Clock", "ContendedWaitKind", "ContendedWaitObserver", "describeErrorChain", "observeContendedWaits"]
names.workplace = ["ATTEMPT_TERMINALS", "CHECK_MISSING_EXIT"]
